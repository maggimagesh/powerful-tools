name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# every job reads the repository only; the publish job asks for more itself
permissions:
  contents: read

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: pip install pyflakes
      - run: pyflakes src tests bin/powerful-tools
      - run: python3 tests/test_logic.py

  package:
    needs: lint-and-unit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ['18.04', '20.04', '22.04', '24.04']
    steps:
      - uses: actions/checkout@v5
      - run: ./build.sh
      - name: Install the .deb in Ubuntu ${{ matrix.ubuntu }} and run all tests as a normal user
        run: tests/docker_test.sh ${{ matrix.ubuntu }}
      - name: Always On Top against a real window manager
        run: tests/docker_aot.sh ${{ matrix.ubuntu }}
      - uses: actions/upload-artifact@v4
        if: matrix.ubuntu == '24.04'
        with:
          name: powerful-tools-deb
          path: dist/*.deb

  # Every push to main that passes all tests updates the download on the Releases page.
  # The release is named after VERSION in src/powerfultools/core.py (e.g. v1.0.0): the .deb on it
  # is replaced and its tag moved to this commit. Bump VERSION to start a new release.
  publish:
    needs: package
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: powerful-tools-deb
          path: dist
      - name: Create or update the release for this version
        run: |
          V=$(sed -n "s/^VERSION = '\(.*\)'/\1/p" src/powerfultools/core.py)
          TAG="v$V"
          DEB=$(ls dist/*.deb)
          # shellcheck disable=SC2016  # the backticks are literal Markdown
          printf 'Built from commit %s on main after all tests passed on Ubuntu 18.04, 20.04, 22.04 and 24.04.\n\nInstall:\n```\nsudo apt install ./%s\n```\n' \
            "${GITHUB_SHA:0:7}" "$(basename "$DEB")" > notes.md
          # a newer commit reached main while this run was testing: let that run publish instead
          if [ "$(git ls-remote origin refs/heads/main | cut -f1)" != "$GITHUB_SHA" ]; then
            echo "main has moved on; skipping publish for this older commit"; exit 0
          fi
          git tag -f "$TAG" "$GITHUB_SHA"
          git push -f origin "refs/tags/$TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            # remove .deb files with other names (e.g. an older naming scheme) so only one remains
            gh release view "$TAG" --json assets -q '.assets[].name' | grep '\.deb$' | grep -vxF "$(basename "$DEB")" \
              | while read -r old; do gh release delete-asset "$TAG" "$old" --yes; done
            gh release upload "$TAG" "$DEB" --clobber
            gh release edit "$TAG" --notes-file notes.md --latest
          else
            gh release create "$TAG" "$DEB" --title "Powerful Tools $V" --notes-file notes.md --latest
          fi
